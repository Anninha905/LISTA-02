<script>
    var A = parseInt(prompt("Digite o valor para A: "));
    var B = parseInt(prompt("Digite o valor para B: "));
    var C = A + B;
    var D = C * C;
    
    document.write("O valor da soma de A + B é: " + C + "<br>");
    document.write("O valor do quadrado da soma de A e B é: " + D + "<br>");
</script>
