<script>
    var A = parseInt(prompt("Digite o valor para A: "));
    var B = parseInt(prompt("Digite o valor para B: "));
    var quadradoA = A * A;
    var quadradoB = B * B;
    var resultado = quadradoA + quadradoB;

    document.write("O valor ao quadrado da soma de A + B é: " + resultado);
</script>
